services:
  db:
    image: postgres:16
    container_name: codesesh_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codesesh
    ports:
      - "5432:5432"
    volumes:
      - codesesh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  codesesh_postgres_data:
